<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${accion} + ' - ' + ${tituloPagina}">Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .form-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            padding: 2rem;
            max-width: 700px;
            margin: 0 auto;
        }
        .btn-custom { border-radius: 8px; font-weight: 500; }
        .campo-solo-lectura {
            background-color: #e9ecef;
            cursor: not-allowed;
        }
        .header-programa {
            background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
            color: white;
            padding: 1rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .header-programa h3 {
            margin: 0;
            font-size: 1.3rem;
        }
        .header-programa p {
            margin: 5px 0 0;
            opacity: 0.9;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container my-5">

        <!-- Navegación -->
        <div class="mb-4">
            <a th:href="@{/{seccionUrl}/{temaUrl} (seccionUrl=${seccionUrl}, temaUrl=${temaUrl})}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Volver a la Lista
            </a>
        </div>

        <!-- Tarjeta del Formulario -->
        <div class="form-card">
            
            <!-- ✅ CABECERA CON EL NOMBRE DEL PROGRAMA ✅ -->
            <div class="header-programa">
                <i class="bi bi-building fs-4"></i>
                <h3 th:text="${tituloPagina}">Nombre del Programa</h3>
                <p th:text="${accion == 'Crear' ? 'Creando nuevo registro' : 'Editando registro existente'}">
                    Acción
                </p>
            </div>

            <hr class="mb-4">

            <!-- Mensaje de Error -->
            <div th:if="${error}" class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-circle"></i> <span th:text="${error}">Error</span>
            </div>
            <div th:if="${mensaje}" class="alert alert-success" role="alert">
                <i class="bi bi-check-circle"></i> <span th:text="${mensaje}">Mensaje</span>
            </div>

            <!-- FORMULARIO -->
            <form th:action="@{${main.id == null ? 
                '/' + seccionUrl + '/' + temaUrl + '/guardar' : 
                '/' + seccionUrl + '/' + temaUrl + '/actualizar/' + main.id}}" 
                method="post" th:object="${main}">

                <!-- Campo Seccion (Oculto) -->
                <input type="hidden" th:field="*{seccion}" th:value="${seccionUrl + '_' + temaUrl}" />

                <!-- Título -->
                <div class="mb-4">
                    <label for="titulo" class="form-label fw-bold">
                        Título / Nombre <span class="text-danger">*</span>
                    </label>
                    <input type="text" id="titulo" th:field="*{titulo}" class="form-control form-control-lg" 
                           placeholder="Ej: Construcción de puente..." required>
                </div>

                <!-- Programa / Área Responsable (SOLO LECTURA) -->
                <div class="mb-4">
                    <label for="programa" class="form-label fw-bold">Programa / Área Responsable</label>
                    <input type="hidden" th:field="*{programa}" th:value="${tituloPagina}">
                    <input type="text" id="programa" th:value="${tituloPagina}" 
                        class="form-control campo-solo-lectura" 
                        readonly disabled>
                    <!-- Campo oculto para enviar el valor al backend -->
                    <!--<input type="hidden" th:field="*{programa}" th:value="${tituloPagina}"> -->
                    <div class="form-text text-muted">
                        <i class="bi bi-info-circle"></i> Este campo es automático y no se puede modificar
                    </div>
                </div>

                <!-- PERIODICAMENTE - Opciones seleccionables -->
                <div class="mb-4">
                    <label for="tiempo" class="form-label fw-bold">Periódicamente</label>
                    <select id="tiempo" th:field="*{tiempo}" class="form-select">
                        <option value="">Seleccione un periodo...</option>
                        <option value="Minuto">Minuto</option>
                        <option value="Hora">Hora</option>
                        <option value="Semanal">Semanal</option>
                        <option value="Quincenal">Quincenal</option>
                        <option value="Mensual">Mensual</option>
                        <option value="Bimestral">Bimestral</option>
                        <option value="Trimestral">Trimestral</option>
                        <option value="Cuatrimestral">Cuatrimestral</option>
                        <option value="Semestral">Semestral</option>
                        <option value="Anual">Anual</option>
                    </select>
                </div>

                <!-- Porcentaje -->
                <div class="mb-4">
                    <label for="porcentaje" class="form-label fw-bold">Porcentaje de Avance (%)</label>
                    <div class="input-group">
                        <input type="number" id="porcentaje" th:field="*{porcentaje}" class="form-control" 
                               min="0" max="100" step="0.1" placeholder="0.0">
                        <span class="input-group-text">%</span>
                    </div>
                    <div class="progress mt-2" style="height: 6px;">
                        <div class="progress-bar bg-success" role="progressbar" id="progresoBar" style="width: 0%"></div>
                    </div>
                </div>

                <!-- Botones -->
                <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-5">
                    <a th:href="@{/{seccionUrl}/{temaUrl} (seccionUrl=${seccionUrl}, temaUrl=${temaUrl})}" class="btn btn-light btn-custom me-md-2">
                        Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary btn-custom">
                        <i class="bi bi-check-lg"></i> <span th:text="${accion}">Guardar</span>
                    </button>
                </div>

            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const porcentajeInput = document.getElementById('porcentaje');
        const progresoBar = document.getElementById('progresoBar');
        function actualizarProgreso() {
            let valor = parseFloat(porcentajeInput.value) || 0;
            if (valor < 0) valor = 0;
            if (valor > 100) valor = 100;
            progresoBar.style.width = valor + '%';
            if (valor < 30) progresoBar.className = 'progress-bar bg-danger';
            else if (valor < 70) progresoBar.className = 'progress-bar bg-warning';
            else progresoBar.className = 'progress-bar bg-success';
        }
        porcentajeInput.addEventListener('input', actualizarProgreso);
        actualizarProgreso();
    </script>
</body>
</html>
