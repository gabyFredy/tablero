# MongoDB - Configuración corregida
spring.data.mongodb.uri=mongodb+srv://fernandogglucena_db_user:Zochit3pec2@tablerocontrol.17yqkkh.mongodb.net/

# Timeouts para detectar fallos rápidamente
spring.data.mongodb.connect-timeout=5000
spring.data.mongodb.socket-timeout=5000
spring.data.mongodb.server-selection-timeout=5000

spring.data.mongodb.connection-pool.max-size=20
spring.data.mongodb.connection-pool.min-size=5
spring.data.mongodb.connection-pool.max-wait-time=120000
spring.data.mongodb.connection-pool.max-connection-life-time=3600000
spring.data.mongodb.connection-pool.max-idle-time=270000
spring.data.mongodb.connection-pool.maintenance-frequency=60000
spring.data.mongodb.connection-pool.maintenance-initial-delay=0

spring.data.mongodb.write-concern=MAJORITY
spring.data.mongodb.read-concern=MAJORITY
spring.data.mongodb.read-preference=PRIMARY_PREFERRED

spring.data.mongodb.database=tablero_control
spring.data.mongodb.auto-index-creation=false

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Logging para ver la conexión a MongoDB
logging.level.org.springframework.security=info
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

