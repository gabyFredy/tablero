# MongoDB - Configuración corregida
spring.data.mongodb.uri=mongodb://localhost:27017/database


# Timeouts para detectar fallos rápidamente
spring.data.mongodb.connect-timeout=5000
spring.data.mongodb.socket-timeout=5000
spring.data.mongodb.server-selection-timeout=5000

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true

# Logging para ver la conexión a MongoDB
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG