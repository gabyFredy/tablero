<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mi Perfil - OmniView</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            color: #1f2937;
        }
        .profile-card {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 16px 40px rgba(0,0,0,0.10);
            border: 1px solid rgba(0,0,0,0.03);
        }
        .profile-avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: linear-gradient(135deg, #0d6efd, #084298);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            font-size: 3rem;
            color: white;
        }
        .divider {
            border-top: 1px solid #e9ecef;
            margin: 1.5rem 0;
        }
        .btn-custom {
            border-radius: 10px;
            font-weight: 500;
            padding: 8px 20px;
            transition: all 0.3s;
        }
        .btn-custom:hover {
            transform: translateY(-2px);
        }
                /* ========== ESTILOS DEL FOOTER ========== */
        .footer {
            background: linear-gradient(135deg, #0d6efd 0%, #084298 100%);
            color: #ffffff;
            padding: 3rem 0 1.5rem;
            margin-top: 4rem;
        }

        .footer-brand {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }

        .footer-desc {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1rem;
        }

        .footer-social {
            display: flex;
            gap: 0.75rem;
        }

        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            border-radius: 6px;
            text-decoration: none;
            transition: background 0.25s ease;
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        .footer-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #ffffff;
        }

        .footer-links {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .footer-links li {
            margin-bottom: 0.5rem;
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.95rem;
        }

        .footer-links li i {
            margin-top: 0.15rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .footer-links li a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            transition: color 0.25s ease;
        }

        .footer-links li a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .footer-bottom {
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            margin-top: 2rem;
            padding-top: 1rem;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="profile-card">
                    
                    <!-- ====== AVATAR Y NOMBRE ====== -->
                    <div class="text-center">
                        <div class="profile-avatar">
                            <i class="bi bi-person-fill"></i>
                        </div>
                        <h2 class="mt-3" th:text="${username}">Usuario</h2>
                        <p class="text-muted">
                            <span th:if="${roles != null and roles.contains('ROLE_ADMIN')}" class="badge bg-danger">Administrador</span>
                            <span th:unless="${roles != null and roles.contains('ROLE_ADMIN')}" class="badge bg-success">Usuario</span>
                        </p>
                    </div>

                    <hr>

                    <!-- ====== INFORMACIÓN DEL USUARIO ====== -->
                    <div class="row">
                        <div class="col-md-6">
                            <p><i class="bi bi-person text-primary"></i> <strong>Nombre:</strong> <span th:text="${nombreCompleto}">Nombre</span></p>
                        </div>
                        <div class="col-md-6">
                            <p><i class="bi bi-envelope text-primary"></i> <strong>Email:</strong> <span th:text="${email}">email@ejemplo.com</span></p>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <p><i class="bi bi-calendar3 text-primary"></i> <strong>Miembro desde:</strong> <span th:text="${fechaRegistro}">01/01/2025</span></p>
                        </div>
                        <div class="col-md-6">
                            <p><i class="bi bi-shield-check text-primary"></i> <strong>Estado:</strong> <span class="badge bg-success">Activo</span></p>
                        </div>
                    </div>

                    <!-- ====== ACCIONES ====== -->
                    <div class="divider"></div>
                    <div class="d-flex flex-wrap justify-content-center gap-2">
                        <a href="/inicio" class="btn btn-primary btn-custom">
                            <i class="bi bi-arrow-left"></i> Volver al Inicio
                        </a>
                        <a href="/cambiar-contraseña" class="btn btn-warning btn-custom">
                            <i class="bi bi-key"></i> Cambiar Contraseña
                        </a>
                        <a href="/admin/usuarios" th:if="${roles != null and roles.contains('ADMIN')}" class="btn btn-info btn-custom text-white">
                            <i class="bi bi-people-fill"></i> Administrar Usuarios
                        </a>
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-danger btn-custom">
                                <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                            </button>
                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragmentos/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
